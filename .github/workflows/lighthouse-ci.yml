name: Lighthouse CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lighthouse-ci:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js application
        run: npm run build

      - name: Start server
        run: |
          npm run start &
          sleep 10  # Wait for server to start
          echo "Server started"

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './lighthouserc.json'

      - name: Comment PR with Lighthouse results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const lighthouseResults = JSON.parse(
              fs.readFileSync('./lighthouserc-results.json', 'utf8')
            );

            let comment = '## 📊 Lighthouse CI Results\n\n';

            if (lighthouseResults && lighthouseResults.length > 0) {
              const latest = lighthouseResults[0];
              const scores = latest.summary;

              comment += '| Category | Score |\n';
              comment += '|----------|-------|\n';
              comment += `| Performance | ${Math.round(scores.performance * 100)} |\n`;
              comment += `| Accessibility | ${Math.round(scores.accessibility * 100)} |\n`;
              comment += `| Best Practices | ${Math.round(scores['best-practices'] * 100)} |\n`;
              comment += `| SEO | ${Math.round(scores.seo * 100)} |\n`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail if Lighthouse score is too low
        if: failure()
        run: |
          echo "❌ Lighthouse CI tests failed"
          echo "Performance audit did not meet required thresholds"
          exit 1

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: lighthouse-results
          path: ./lighthouse-results/
          retention-days: 30
